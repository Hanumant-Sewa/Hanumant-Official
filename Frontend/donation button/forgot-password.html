<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Hanumant Seva</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >


    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <link
        rel="stylesheet"
        href="donation.css"
    >

</head>


<body>


<div class="simple-auth-page">


    <div class="auth-card forgot-card">


        <!-- BACK TO LOGIN -->

        <a
            href="login.html"
            class="back-home"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Back to Sign In

        </a>



        <!-- ================= HEADING ================= -->

        <div class="auth-heading">


            <div class="auth-icon">

                <i class="fa-solid fa-key"></i>

            </div>


            <h2>
                Forgot Password?
            </h2>


            <p>
                Enter your registered email address
                to reset your password.
            </p>


        </div>



        <!-- ================= FORM ================= -->

        <form id="forgotForm">


            <div class="input-group">


                <label>
                    Email Address
                </label>


                <div class="input-box">


                    <i class="fa-solid fa-envelope"></i>


                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter your email"
                        required
                    >


                </div>


            </div>



            <button
                type="submit"
                class="auth-btn"
            >

                Continue

                <i class="fa-solid fa-arrow-right"></i>

            </button>


        </form>



        <div
            id="forgotMessage"
            class="form-message"
        ></div>


    </div>

</div>



<script src="donation.js"></script>


</body>

</html>
